services:
  - type: web
    name: bolshoy-myasnoy-staging
    runtime: docker
    plan: free
    region: frankfurt
    branch: staging
    autoDeployTrigger: checksPass
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings_staging
      - key: DJANGO_DEBUG
        value: "0"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: MINIAPP_BOT_USERNAME
        value: bmmsev_bot
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Dashboard-managed: Blueprint updates must not reset the pickup launch.
      # Set all three to 0 in Render before first release; enable after approval.
      - key: MINIAPP_ORDERS_ENABLED
        sync: false
      - key: STAGING_PICKUP_ENABLED
        sync: false
      - key: TELEGRAM_NOTIFICATIONS_ENABLED
        sync: false
      - key: TELEGRAM_ADMIN_CHAT_ID
        sync: false
      - key: MINIAPP_WEIGHT_ESTIMATE
        value: "1"
      - key: MINIAPP_SHOW_DEMO_CONTENT
        value: "0"
      - key: AWS_ENDPOINT_URL_S3
        sync: false
      - key: AWS_REGION
        value: eu-central-1
      - key: AWS_STORAGE_BUCKET_NAME
        value: bm-staging-media
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
